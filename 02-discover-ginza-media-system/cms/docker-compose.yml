services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: discover_ginza
      POSTGRES_PASSWORD: discover_ginza_dev
      POSTGRES_DB: discover_ginza
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
